name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: build · test · bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test dist/tests/

      - name: Bench
        run: npm run bench
