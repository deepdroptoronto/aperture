services:
  aperture:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepdrop/aperture:1.0.0
    init: true
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      APERTURE_BUDGET_BYTES: "234881024"
      APERTURE_MAX_CONCURRENCY: "64"
      # Set on the host to enable /stats and /__aperture/proof. Empty disables them.
      APERTURE_ADMIN_TOKEN: "${APERTURE_ADMIN_TOKEN:-}"
    restart: unless-stopped
